[package]
name = "litesvm-token-extensions"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Token-2022 mint and account extension builders for LiteSVM tests"
repository = "https://github.com/daiwanwei/litesvm-token-extensions"
readme = "README.md"
keywords = ["solana", "litesvm", "token-2022", "spl-token", "testing"]
categories = ["cryptography::cryptocurrencies", "development-tools::testing"]

[dependencies]
litesvm = "0.11"
spl-token-2022-interface = "2"
solana-instruction = "3"
solana-keypair = "3"
solana-pubkey = "4"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = "3"
